name: Frontend migration verification

on:
  push:
    branches:
      - migration/employee-account-entry
      - migration/role-dashboards-preview
      - migration/projects-readonly-port
      - migration/operations-ui-port
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tests, types, lint, production build and preview route
        run: npm run check
